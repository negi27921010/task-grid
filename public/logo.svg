<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" role="img" aria-label="Taskly">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3186FF"/>
      <stop offset="1" stop-color="#1E63D9"/>
    </linearGradient>
  </defs>

  <!-- App-icon style rounded square -->
  <rect width="256" height="256" rx="56" fill="url(#bg)"/>

  <!-- Calendar body: stroke outlines a rounded card -->
  <rect x="44" y="64" width="168" height="156" rx="20" fill="#FFFFFF"/>

  <!-- Top header strip (the date row), Antigravity blue -->
  <path d="M44 96 L44 84 a20 20 0 0 1 20 -20 L192 64 a20 20 0 0 1 20 20 L212 96 Z" fill="#3186FF"/>

  <!-- Two binding rings poking out of the header -->
  <rect x="80"  y="40" width="14" height="44" rx="7" fill="#1E63D9"/>
  <rect x="162" y="40" width="14" height="44" rx="7" fill="#1E63D9"/>

  <!-- Bold check mark in the calendar body -->
  <path d="M82 158 L116 192 L182 124"
        fill="none" stroke="#3186FF" stroke-width="20"
        stroke-linecap="round" stroke-linejoin="round"/>
</svg>
